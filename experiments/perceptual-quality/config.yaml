perceptual_1:
  data_split_file: "./data/metadata.jsonl"
  batch_size: 16
  num_workers: 4
  epochs: 100
  lr: 0.001
  earlystopping: false
  patience: 10
  delta: 0.00001
  save_dir: "checkpoints"
  segment_length: 176400 # 44100 * 4
  sample_rate: 44100

derev_1:
  data_split_file: "./data/metadata.jsonl"
  batch_size: 16
  num_workers: 4
  epochs: 1
  lr: 0.001
  save_dir: "checkpoints"
  model_out: "output/derevnet.pt"
  segment_length: 176400 # 44100 * 4
  sample_rate: 44100
  loss: "perceptual"
  perceptual_loss_model_path: "checkpoints/epoch_101-size-perceptual_net_best.pth"
  gradient_checkpointing: true
  model:
    encoder_channels: 64
    tcn_channels: [64, 64, 64, 64, 64]
    kernel_size: 4
    dropout: 0.1
    causal: true
    use_norm: "weight_norm"
    activation: "relu"
    lookahead: 0
    use_skip_connections: false
    num_blocks_per_repeat: 0
    num_repeats: 0
    dilations: null

derev_1_increased:
  data_split_file: "./data/metadata.jsonl"
  batch_size: 8
  accumulate_grad_batches: 4 # effective batch = 8 × 4 = 32
  num_workers: 4
  epochs: 100
  lr: 0.0001
  save_dir: "checkpoints"
  model_out: "output/derevnet.pt"
  segment_length: 176400 # 44100 * 4
  sample_rate: 44100
  loss: "perceptual"
  perceptual_loss_model_path: "checkpoints/epoch_101-size-perceptual_net_best.pth"
  gradient_checkpointing: true
  model:
    encoder_channels: 265
    tcn_channels: null
    kernel_size: 3
    dropout: 0.0
    causal: false
    use_norm: "layer_norm"
    activation: "relu"
    lookahead: 0
    use_skip_connections: true
    num_blocks_per_repeat: 8
    num_repeats: 3
    dilations: null

derev_tcn_v1:
  data_split_file: "./data/metadata.jsonl"
  batch_size: 4
  accumulate_grad_batches: 4  # effective batch = 8 × 4 = 32
  num_workers: 4
  epochs: 100
  lr: 0.0001
  save_dir: "checkpoints"
  model_out: "output/derev_tcn_v1.pt"
  segment_length: 88200 #176400  # 44100 * 4
  sample_rate: 44100
  loss: "perceptual"
  perceptual_loss_model_path: "checkpoints/epoch_195-odg-perceptual_net_best.pth"
  gradient_checkpointing: true
  model:
    encoder_channels: 256
    tcn_channels: [128, 128, 128, 128, 128, 128, 128, 128]  # uniform 128 channels across all blocks
    kernel_size: 3
    dropout: 0.1
    causal: false
    use_norm: "layer_norm"
    activation: "relu"
    lookahead: 0
    use_skip_connections: true
    num_blocks_per_repeat: 8
    num_repeats: 4
    dilations: [1, 2, 4, 8, 16, 32, 64, 128]

perceptual_compare_1:
  data_split_file: "./data/metadata.jsonl"
  batch_size: 16
  num_workers: 4
  epochs: 10
  lr: 0.001
  earlystopping: false
  patience: 10
  delta: 0.00001
  save_dir: "checkpoints"
  segment_length: 176400 # 44100 * 4
  sample_rate: 44100